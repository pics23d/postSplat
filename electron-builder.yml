# [custom] Desktop packaging. `npm run desktop:pack` -> release/
appId: de.guy-middleton.postsplat
productName: postSplat
copyright: Copyright (c) 2011-2026 PlayCanvas Ltd. and (c) 2026 Guy Middleton. MIT.

directories:
  output: release

files:
  - dist/**
  - "!dist/**/*.map"
  - electron/dist/**
  - "!electron/dist/**/*.map"
  - package.json

asar: true

win:
  target:
    # zip first: the lowest-friction way to hand a build to someone -
    # unpack and run, no installer, nothing written to the registry, and it
    # survives being passed around as a file. nsis stays for a real install.
    - zip
    - nsis
    - portable
  icon: static/icons/logo-512.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: postSplat

portable:
  artifactName: ${productName}-${version}-portable.exe

zip:
  artifactName: ${productName}-${version}-win-x64.zip
